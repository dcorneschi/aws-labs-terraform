<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#232F3E">
  <title>lab-01 scale-out sequence: burn the CPU, alarm fires, second Spot instance launches, alarm returns to OK</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/>
    </marker>
  </defs>

  <rect width="1000" height="610" fill="#FFFFFF"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold">Scale-out, step by step</text>

  <!-- Lifelines -->
  <g stroke="#AAB7B8" stroke-width="1.2" stroke-dasharray="5 4">
    <line x1="90" y1="104" x2="90" y2="590"/>
    <line x1="250" y1="104" x2="250" y2="590"/>
    <line x1="410" y1="104" x2="410" y2="590"/>
    <line x1="570" y1="104" x2="570" y2="590"/>
    <line x1="730" y1="104" x2="730" y2="590"/>
    <line x1="890" y1="104" x2="890" y2="590"/>
  </g>

  <!-- Participants -->
  <rect x="20" y="50" width="140" height="54" rx="8" fill="#F2F3F3" stroke="#545B64"/>
  <text x="90" y="82" text-anchor="middle" font-weight="bold">You</text>

  <rect x="180" y="50" width="140" height="54" rx="8" fill="#FDEEF5" stroke="#E7157B"/>
  <text x="250" y="73" text-anchor="middle" font-weight="bold">Systems</text>
  <text x="250" y="91" text-anchor="middle" font-weight="bold">Manager</text>

  <rect x="340" y="50" width="140" height="54" rx="8" fill="#FFF4E8" stroke="#ED7100"/>
  <text x="410" y="82" text-anchor="middle" font-weight="bold">Spot instance 1</text>

  <rect x="500" y="50" width="140" height="54" rx="8" fill="#FDEEF5" stroke="#E7157B"/>
  <text x="570" y="73" text-anchor="middle" font-weight="bold">CloudWatch alarm</text>
  <text x="570" y="91" text-anchor="middle" font-size="12">asg-lab-cpu-high</text>

  <rect x="660" y="50" width="140" height="54" rx="8" fill="#FFFAF3" stroke="#ED7100"/>
  <text x="730" y="73" text-anchor="middle" font-weight="bold">Auto Scaling group</text>
  <text x="730" y="91" text-anchor="middle" font-size="12">asg-lab</text>

  <rect x="820" y="50" width="140" height="54" rx="8" fill="#FFFFFF" stroke="#ED7100" stroke-dasharray="5 3"/>
  <text x="890" y="82" text-anchor="middle" font-weight="bold">Spot instance 2</text>

  <!-- Messages -->
  <g stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="90" y1="145" x2="248" y2="145"/>
    <line x1="250" y1="185" x2="408" y2="185"/>
    <line x1="410" y1="265" x2="568" y2="265"/>
    <line x1="570" y1="345" x2="728" y2="345"/>
    <line x1="730" y1="385" x2="888" y2="385"/>
    <line x1="410" y1="465" x2="568" y2="465"/>
    <line x1="890" y1="505" x2="572" y2="505"/>
  </g>

  <!-- Message labels -->
  <g text-anchor="middle">
    <text x="106" y="138" text-anchor="start">send-command burn.sh 900</text>
    <text x="330" y="178">run burn.sh</text>
    <text x="490" y="258">CPUUtilization ≈ 100%</text>
    <text x="650" y="338">run scale-out policy (+1)</text>
    <text x="810" y="378">launch a Spot instance</text>
    <text x="490" y="458">≈ 100%</text>
    <text x="810" y="498">≈ 0% (idle)</text>
  </g>

  <!-- Step numbers -->
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <circle cx="90" cy="145" r="9" fill="#232F3E"/><text x="90" y="149" fill="#FFFFFF">1</text>
    <circle cx="250" cy="185" r="9" fill="#232F3E"/><text x="250" y="189" fill="#FFFFFF">2</text>
    <circle cx="410" cy="265" r="9" fill="#232F3E"/><text x="410" y="269" fill="#FFFFFF">3</text>
    <circle cx="570" cy="345" r="9" fill="#232F3E"/><text x="570" y="349" fill="#FFFFFF">4</text>
    <circle cx="730" cy="385" r="9" fill="#232F3E"/><text x="730" y="389" fill="#FFFFFF">5</text>
    <circle cx="410" cy="465" r="9" fill="#232F3E"/><text x="410" y="469" fill="#FFFFFF">6</text>
    <circle cx="890" cy="505" r="9" fill="#232F3E"/><text x="890" y="509" fill="#FFFFFF">7</text>
  </g>

  <!-- Notes -->
  <g text-anchor="middle">
    <rect x="320" y="205" width="180" height="32" rx="4" fill="#FFF8DC" stroke="#C9A400"/>
    <text x="410" y="226">every vCPU at 100%</text>

    <rect x="440" y="285" width="260" height="38" rx="4" fill="#FDECEA" stroke="#D13212"/>
    <text x="570" y="309">average ≥ 75% for 1 period → <tspan font-weight="bold" fill="#D13212">ALARM</tspan></text>

    <rect x="610" y="405" width="240" height="38" rx="4" fill="#FFF8DC" stroke="#C9A400"/>
    <text x="730" y="429">desired 2 = max 2 · cooldown 300 s</text>

    <rect x="430" y="525" width="280" height="44" rx="4" fill="#EAF6E6" stroke="#248814"/>
    <text x="570" y="543">group average ≈ 50% &lt; 75% → <tspan font-weight="bold" fill="#248814">OK</tspan></text>
    <text x="570" y="561" font-size="12" fill="#545B64">the group stays at 2 instances</text>
  </g>
</svg>
