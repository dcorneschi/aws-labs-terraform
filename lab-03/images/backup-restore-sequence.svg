<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#232F3E">
  <title>lab-03 sequence: create the source instance, take an AMI, copy it to the secondary Region, launch the restored instance and check the marker</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#FFFFFF"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold">Backup and restore, step by step</text>

  <!-- Lifelines -->
  <g stroke="#AAB7B8" stroke-width="1.2" stroke-dasharray="5 4">
    <line x1="90" y1="104" x2="90" y2="545"/>
    <line x1="250" y1="104" x2="250" y2="545"/>
    <line x1="410" y1="104" x2="410" y2="545"/>
    <line x1="570" y1="104" x2="570" y2="545"/>
    <line x1="730" y1="104" x2="730" y2="545"/>
    <line x1="890" y1="104" x2="890" y2="545"/>
  </g>

  <!-- Participants -->
  <rect x="20" y="50" width="140" height="54" rx="8" fill="#F2F3F3" stroke="#545B64"/>
  <text x="90" y="82" text-anchor="middle" font-weight="bold">Terraform</text>

  <rect x="180" y="50" width="140" height="54" rx="8" fill="#FFF4E8" stroke="#ED7100"/>
  <text x="250" y="73" text-anchor="middle" font-weight="bold">Source instance</text>
  <text x="250" y="91" text-anchor="middle" font-size="12">eu-west-1</text>

  <rect x="340" y="50" width="140" height="54" rx="8" fill="#FFF4E8" stroke="#ED7100"/>
  <text x="410" y="73" text-anchor="middle" font-weight="bold">AMI</text>
  <text x="410" y="91" text-anchor="middle" font-size="12">eu-west-1</text>

  <rect x="500" y="50" width="140" height="54" rx="8" fill="#FFF4E8" stroke="#ED7100"/>
  <text x="570" y="73" text-anchor="middle" font-weight="bold">AMI copy</text>
  <text x="570" y="91" text-anchor="middle" font-size="12">eu-central-1</text>

  <rect x="660" y="50" width="140" height="54" rx="8" fill="#FFF4E8" stroke="#ED7100"/>
  <text x="730" y="73" text-anchor="middle" font-weight="bold">Restored instance</text>
  <text x="730" y="91" text-anchor="middle" font-size="12">eu-central-1</text>

  <rect x="820" y="50" width="140" height="54" rx="8" fill="#F2F3F3" stroke="#545B64"/>
  <text x="890" y="73" text-anchor="middle" font-weight="bold">You</text>
  <text x="890" y="91" text-anchor="middle" font-size="12">via Systems Manager</text>

  <!-- Messages -->
  <g stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="90" y1="145" x2="248" y2="145"/>
    <line x1="90" y1="275" x2="408" y2="275"/>
    <line x1="90" y1="355" x2="568" y2="355"/>
    <line x1="90" y1="435" x2="728" y2="435"/>
    <line x1="890" y1="475" x2="732" y2="475"/>
    <line x1="730" y1="515" x2="888" y2="515" stroke-dasharray="6 4"/>
  </g>

  <g text-anchor="middle">
    <text x="106" y="138" text-anchor="start">run-instances + user data</text>
    <text x="250" y="268">create-image (the instance reboots)</text>
    <text x="330" y="348">copy-image from eu-west-1</text>
    <text x="410" y="428">run-instances from the copy</text>
    <text x="810" y="468">cat marker</text>
    <text x="746" y="508" text-anchor="start" font-size="12">"created on i-… in eu-west-1"</text>
  </g>

  <g font-size="11" font-weight="bold" text-anchor="middle">
    <circle cx="90" cy="145" r="9" fill="#232F3E"/><text x="90" y="149" fill="#FFFFFF">1</text>
    <circle cx="90" cy="275" r="9" fill="#232F3E"/><text x="90" y="279" fill="#FFFFFF">3</text>
    <circle cx="90" cy="355" r="9" fill="#232F3E"/><text x="90" y="359" fill="#FFFFFF">4</text>
    <circle cx="90" cy="435" r="9" fill="#232F3E"/><text x="90" y="439" fill="#FFFFFF">5</text>
    <circle cx="890" cy="475" r="9" fill="#232F3E"/><text x="890" y="479" fill="#FFFFFF">6</text>
    <circle cx="730" cy="515" r="9" fill="#232F3E"/><text x="730" y="519" fill="#FFFFFF">7</text>
  </g>

  <!-- Notes -->
  <g text-anchor="middle">
    <rect x="150" y="165" width="200" height="32" rx="4" fill="#FFF8DC" stroke="#C9A400"/>
    <text x="250" y="186">writes /etc/ami-lab-marker</text>

    <rect x="20" y="215" width="140" height="36" rx="4" fill="#FFF8DC" stroke="#C9A400"/>
    <circle cx="36" cy="233" r="9" fill="#232F3E"/><text x="36" y="237" fill="#FFFFFF" font-size="11" font-weight="bold">2</text>
    <text x="98" y="238">wait 90 s</text>

    <rect x="310" y="295" width="200" height="32" rx="4" fill="#FFF8DC" stroke="#C9A400"/>
    <text x="410" y="316">snapshot of the root volume</text>

    <rect x="460" y="375" width="220" height="32" rx="4" fill="#FFF8DC" stroke="#C9A400"/>
    <text x="570" y="396">several minutes · encrypted</text>
  </g>
</svg>
